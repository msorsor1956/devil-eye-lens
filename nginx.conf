# Loaded inside the image's http block. Railway terminates public HTTPS.
# Keep query strings, IP addresses and referrers out of application access logs.
# Railway's edge logs are controlled separately by the hosting provider.
log_format minimal '$time_iso8601 $request_method $uri $status $body_bytes_sent';

limit_req_zone $binary_remote_addr zone=paypal:10m rate=2r/s;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    autoindex off;
    access_log /dev/stdout minimal;
    error_log /dev/stderr warn;
    client_max_body_size 16k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 30s;
    keepalive_timeout 30s;

    # All scripts, fonts, photographs and film are served from this origin.
    # Hosted payment links are top-level navigation, not embedded frames.
    # Revisit this policy when a real backend or embedded Stripe UI is added.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self' https://*.paypal.com https://*.paypalobjects.com; script-src-attr 'none'; style-src 'self' 'unsafe-inline'; style-src-attr 'unsafe-inline'; img-src 'self' data: https://*.paypal.com https://*.paypalobjects.com; font-src 'self'; media-src 'self'; connect-src 'self' https://*.paypal.com https://*.paypalobjects.com; manifest-src 'self'; object-src 'none'; frame-src https://*.paypal.com; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; upgrade-insecure-requests" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), usb=(), serial=(), bluetooth=(), accelerometer=(), gyroscope=(), magnetometer=(), payment=()" always;
    # Scope HSTS to this host; do not force policies on unrelated subdomains.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Cross-Origin-Opener-Policy same-origin-allow-popups always;
    add_header Cross-Origin-Resource-Policy same-origin always;

    # This deployment is a read-only storefront, with no form/API endpoints.


    location ~ /\. { return 404; }
    location ~* \.(?:env|sql|bak|log|map|ini|conf|sh|ya?ml)$ { return 404; }

    location /api/paypal/ {
        limit_req zone=paypal burst=10 nodelay;
        limit_req_status 429;
        client_max_body_size 256k;
        proxy_pass http://127.0.0.1:3001;
        proxy_read_timeout 65s;
        proxy_connect_timeout 3s;
    }
    location = /api/stripe/webhook {
        client_max_body_size 256k;
        if ($request_method != POST) { return 405; }
        proxy_pass http://127.0.0.1:3000;
        proxy_read_timeout 20s;
        proxy_connect_timeout 3s;
    }
    location = /api/stripe/health {
        if ($request_method != GET) { return 405; }
        proxy_pass http://127.0.0.1:3000;
    }
    location / {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        try_files $uri $uri/ =404;
    }
}
