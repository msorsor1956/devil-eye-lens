# Loaded inside the image's http block. Railway terminates public HTTPS.
# Keep query strings, IP addresses and referrers out of application access logs.
# Railway's edge logs are controlled separately by the hosting provider.
log_format minimal '$time_iso8601 $request_method $uri $status $body_bytes_sent';

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    autoindex off;
    access_log /dev/stdout minimal;
    error_log /dev/stderr warn;
    client_max_body_size 16k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 30s;
    keepalive_timeout 30s;

    # All scripts, fonts, photographs and film are served from this origin.
    # Hosted payment links are top-level navigation, not embedded frames.
    # Revisit this policy when a real backend or embedded Stripe UI is added.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; script-src-attr 'none'; style-src 'self'; style-src-attr 'none'; img-src 'self'; font-src 'self'; media-src 'self'; connect-src 'self'; manifest-src 'self'; object-src 'none'; frame-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; upgrade-insecure-requests" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), usb=(), serial=(), bluetooth=(), accelerometer=(), gyroscope=(), magnetometer=(), payment=()" always;
    # Scope HSTS to this host; do not force policies on unrelated subdomains.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Resource-Policy same-origin always;

    # This deployment is a read-only storefront, with no form/API endpoints.
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    location ~ /\. { return 404; }
    location ~* \.(?:env|sql|bak|log|map|ini|conf|sh|ya?ml)$ { return 404; }

    location / {
        try_files $uri $uri/ =404;
    }
}
